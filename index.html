<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JPlanner | Sistema de manejo de tareas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <p class="eyebrow">JPlanner Workspace</p>
        <h1>Sistema de manejo de tareas</h1>
      </div>
      <button class="btn primary" type="button" id="newTaskTop">Nueva tarea</button>
    </header>

    <main class="layout">
      <aside class="panel">
        <h2>Crear tarea</h2>
        <form id="taskForm" class="task-form">
          <label>
            Nombre
            <input id="taskTitle" name="title" type="text" required maxlength="80" />
          </label>

          <label>
            Responsable
            <input id="taskOwner" name="owner" type="text" required maxlength="40" />
          </label>

          <label>
            Fecha
            <input id="taskDue" name="due" type="date" required />
          </label>

          <label>
            Prioridad
            <select id="taskPriority" name="priority" required>
              <option value="Alta">Alta</option>
              <option value="Media">Media</option>
              <option value="Baja">Baja</option>
            </select>
          </label>

          <button class="btn primary" type="submit">Agregar tarea</button>
        </form>

        <section class="summary" aria-live="polite">
          <h3>Resumen</h3>
          <p>Total: <strong id="totalCount">0</strong></p>
          <p>Pendiente: <strong id="todoCount">0</strong></p>
          <p>En progreso: <strong id="doingCount">0</strong></p>
          <p>Completado: <strong id="doneCount">0</strong></p>
        </section>
      </aside>

      <section class="board" aria-label="Tablero de tareas">
        <article class="column" data-status="todo">
          <header>
            <h2>Pendiente</h2>
            <span id="todoBadge" class="badge">0</span>
          </header>
          <div id="todoList" class="task-list"></div>
        </article>

        <article class="column" data-status="doing">
          <header>
            <h2>En progreso</h2>
            <span id="doingBadge" class="badge">0</span>
          </header>
          <div id="doingList" class="task-list"></div>
        </article>

        <article class="column" data-status="done">
          <header>
            <h2>Completado</h2>
            <span id="doneBadge" class="badge">0</span>
          </header>
          <div id="doneList" class="task-list"></div>
        </article>
      </section>
    </main>

    <script src="/script.js"></script>
  </body>
</html>
