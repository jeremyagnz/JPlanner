<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JPlanner</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="topbar">
      <h1>JPlanner</h1>
      <p>Sistema completo de planificación personal</p>
      <button id="focusToggle" class="focus-btn">Activar Focus Mode</button>
    </header>

    <nav class="tabs" id="tabs"></nav>

    <main>
      <section id="daily" class="view"></section>
      <section id="weekly" class="view hidden"></section>
      <section id="monthly" class="view hidden"></section>
      <section id="quarterly" class="view hidden"></section>
      <section id="yearly" class="view hidden"></section>
      <section id="breakdown" class="view hidden"></section>
      <section id="life" class="view hidden"></section>
      <section id="vision" class="view hidden"></section>
      <section id="smart" class="view hidden"></section>
      <section id="hierarchy" class="view hidden"></section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
